name: build

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ls "$ANDROID_HOME/build-tools" | tail -3

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build unsigned
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Sign with apksigner
        run: |
          base64 -d quickill.keystore.b64 > /tmp/quickill.keystore
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/quickill.keystore --ks-pass pass:quickill123 \
            --key-pass pass:quickill123 --ks-key-alias quickill \
            --out app/build/outputs/apk/release/ka_quic_kill.apk /tmp/aligned.apk
          "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/ka_quic_kill.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: ka_quic_kill-apk
          path: app/build/outputs/apk/release/ka_quic_kill.apk
